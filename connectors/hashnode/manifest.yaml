key: hashnode
version: 1.0.0
tier: native
auth: api_key
surfaces:
  - key: article
    content_types: [text, image]
    spec:
      title_max_chars: 250
      body_max_chars: 100000
      links_allowed: true
      tags_max: 5
rate_limits:
  per_connection: {requests: 60, per_seconds: 60}
capabilities: [publish, status, delete]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "401": CONNECTION_AUTH_EXPIRED
instance_param: null
