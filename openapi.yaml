openapi: 3.1.0
info:
  title: IncuBrix Long-Tail Distribution
  description: Publishing connectors and intelligence for long-tail destinations.
    Part of the IncuBrix distribution product.
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - Health
      summary: Liveness check
      description: Returns 200 immediately — used by Docker/Kubernetes liveness probes.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /ready:
    get:
      tags:
      - Health
      summary: Readiness check
      description: 'Returns 200 only when Postgres, Redis, and MinIO are reachable.

        Returns 503 if any dependency is down.'
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/jobs/{job_id}:
    get:
      tags:
      - Jobs
      summary: Get background job status
      description: 'Poll a background job by ID.

        Returns status, progress (0-100), and result links when complete.'
      operationId: get_job_status_api_v1_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /connector/v1/{connector_key}/validate:
    post:
      tags:
      - Connector Contract
      summary: Validate
      description: Check content against destination format limits before publishing.
      operationId: validate_connector_v1__connector_key__validate_post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /connector/v1/{connector_key}/publish:
    post:
      tags:
      - Connector Contract
      summary: Publish
      description: Publish content to the platform. Returns platform_post_id + live_url.
      operationId: publish_connector_v1__connector_key__publish_post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /connector/v1/{connector_key}/get_status:
    post:
      tags:
      - Connector Contract
      summary: Get Status
      description: Check if a published post is still live.
      operationId: get_status_connector_v1__connector_key__get_status_post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetStatusRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /connector/v1/{connector_key}/delete:
    post:
      tags:
      - Connector Contract
      summary: Delete
      description: Delete a published post (used during certification cleanup).
      operationId: delete_connector_v1__connector_key__delete_post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /connector/v1/{connector_key}/fetch_metrics:
    post:
      tags:
      - Connector Contract
      summary: Fetch Metrics
      description: Fetch engagement metrics (optional — not all connectors support
        this).
      operationId: fetch_metrics_connector_v1__connector_key__fetch_metrics_post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchMetricsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchMetricsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /connector/v1/{connector_key}/refresh_auth:
    post:
      tags:
      - Connector Contract
      summary: Refresh Auth
      description: Refresh an expired auth token (optional).
      operationId: refresh_auth_connector_v1__connector_key__refresh_auth_post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshAuthRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshAuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /connector/v1/{connector_key}/build_assist_pack:
    post:
      tags:
      - Connector Contract
      summary: Build Assist Pack
      description: Build a ready-to-post pack for non-automatable destinations (assisted
        tier).
      operationId: build_assist_pack_connector_v1__connector_key__build_assist_pack_post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildAssistPackRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildAssistPackResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/publish:
    post:
      tags:
      - Publish
      summary: Publish content to a destination
      description: 'Submit a publish job. Returns 202 + job_id immediately.

        Poll GET /api/v1/jobs/{job_id} for status.'
      operationId: publish_api_v1_publish_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishJobRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/destinations:
    get:
      tags:
      - Destinations & Catalogue
      summary: List Destinations
      description: List all destinations. Optionally filter by connector_key or level.
      operationId: list_destinations_api_v1_destinations_get
      parameters:
      - name: connector_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Connector Key
      - name: level
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Level
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DestinationResponse'
                title: Response List Destinations Api V1 Destinations Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Destinations & Catalogue
      summary: Create Destination
      description: Add a new destination to the catalogue. One row = one new instance
        (no new code).
      operationId: create_destination_api_v1_destinations_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/destinations/{destination_id}:
    get:
      tags:
      - Destinations & Catalogue
      summary: Get Destination
      description: Get a single destination by ID.
      operationId: get_destination_api_v1_destinations__destination_id__get
      parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: string
          title: Destination Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/destinations/{destination_id}/rules:
    put:
      tags:
      - Destinations & Catalogue
      summary: Update Rules
      description: Update posting rules for a destination.
      operationId: update_rules_api_v1_destinations__destination_id__rules_put
      parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: string
          title: Destination Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationRulesUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connectors:
    get:
      tags:
      - Destinations & Catalogue
      summary: List all registered connectors
      description: List all loaded connectors with their manifest info.
      operationId: list_connectors_endpoint_api_v1_connectors_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/certify:
    post:
      tags:
      - Certification
      summary: Run certification for a connector + destination
      description: Start a certification run. Returns 202 + job_id.
      operationId: certify_api_v1_certify_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertifyRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/catalogue/import:
    post:
      tags:
      - Catalogue & Rules
      summary: Import catalogue from CSV (Advanced)
      description: Import destinations from CSV file with 50-worker bounded reachability
        checks.
      operationId: import_catalogue_api_v1_catalogue_import_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_import_catalogue_api_v1_catalogue_import_post'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/rules/capture:
    post:
      tags:
      - Catalogue & Rules
      summary: AI rules capture from destination rules page (Advanced)
      description: AI reads destination rules page and proposes rules.
      operationId: capture_rules_api_v1_rules_capture_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulesCaptureRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/rules/{proposal_id}/confirm:
    post:
      tags:
      - Catalogue & Rules
      summary: Human confirms a proposed rule
      description: 'Confirm an AI-proposed rule.

        Phase 4.2 compliance: confirmed values are written directly into the destination
        fields

        that the rules engine reads!'
      operationId: confirm_rule_api_v1_rules__proposal_id__confirm_post
      parameters:
      - name: proposal_id
        in: path
        required: true
        schema:
          type: string
          title: Proposal Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_confirm_rule_api_v1_rules__proposal_id__confirm_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/recommend:
    get:
      tags:
      - Recommender & Admin
      summary: Rank destinations by fit for a content item (Outstanding)
      description: 'Given a content item, rank all certified destinations by fit.


        Scoring factors:

        - Audience alignment: AI, video, marketing, SaaS, creators, founders (40%)

        - Rules compatibility: promo policy, link policy, automation allowed (30%)

        - Historical publish success rate (30%)


        Returns destinations sorted by score descending with a reason for each.'
      operationId: recommend_destinations_api_v1_recommend_get
      parameters:
      - name: title
        in: query
        required: true
        schema:
          type: string
          description: Content title
          title: Title
        description: Content title
      - name: body
        in: query
        required: false
        schema:
          type: string
          description: Content body (first 500 chars used for scoring)
          default: ''
          title: Body
        description: Content body (first 500 chars used for scoring)
      - name: has_links
        in: query
        required: false
        schema:
          type: boolean
          description: Does the content contain links?
          default: true
          title: Has Links
        description: Does the content contain links?
      - name: is_promo
        in: query
        required: false
        schema:
          type: boolean
          description: Is the content promotional?
          default: false
          title: Is Promo
        description: Is the content promotional?
      - name: connector_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by connector
          title: Connector Key
        description: Filter by connector
      - name: top_n
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          description: Number of results
          default: 10
          title: Top N
        description: Number of results
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/recertify:
    post:
      tags:
      - Recommender & Admin
      summary: Trigger manual recertification cycle for all due destinations
      description: 'Manually trigger the recertification cycle.

        Checks all L3/L4 destinations, re-certifies those due (>30 days),

        demotes failures to L2 and returns a summary.'
      operationId: trigger_recertification_api_v1_admin_recertify_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/admin/recert/status:
    get:
      tags:
      - Recommender & Admin
      summary: Last recertification cycle summary
      description: Get the summary of the last recertification cycle.
      operationId: recert_status_api_v1_admin_recert_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/tailor:
    post:
      tags:
      - Tailoring
      summary: Tailor content for destination
      description: Adapt content structure, length, and style for the destination.
      operationId: tailor_content_endpoint_api_v1_tailor_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TailorRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TailorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alerts:
    get:
      tags:
      - Alerts
      summary: List system alerts
      description: List alerts for schema drift, demotions, and failed recertifications.
      operationId: list_alerts_api_v1_alerts_get
      parameters:
      - name: alert_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Alert Type
      - name: destination_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Destination Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertResponse'
                title: Response List Alerts Api V1 Alerts Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/metrics/fetch:
    post:
      tags:
      - Metrics
      summary: Fetch and store metric snapshot
      description: Fetch metrics from connector, normalize, and store snapshot in
        database.
      operationId: fetch_and_store_metrics_api_v1_metrics_fetch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricFetchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSnapshotResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AlertResponse:
      properties:
        id:
          type: string
          title: Id
        destination_id:
          type: string
          title: Destination Id
        connector_key:
          type: string
          title: Connector Key
        alert_type:
          type: string
          title: Alert Type
        message:
          type: string
          title: Message
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - destination_id
      - connector_key
      - alert_type
      - message
      - created_at
      title: AlertResponse
    Body_confirm_rule_api_v1_rules__proposal_id__confirm_post:
      properties:
        confirmed_by:
          type: string
          title: Confirmed By
      type: object
      required:
      - confirmed_by
      title: Body_confirm_rule_api_v1_rules__proposal_id__confirm_post
    Body_import_catalogue_api_v1_catalogue_import_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_import_catalogue_api_v1_catalogue_import_post
    BuildAssistPackRequest:
      properties:
        rendition:
          $ref: '#/components/schemas/Rendition'
        destination:
          $ref: '#/components/schemas/DestinationRef'
      type: object
      required:
      - rendition
      - destination
      title: BuildAssistPackRequest
    BuildAssistPackResponse:
      properties:
        instructions:
          type: string
          title: Instructions
        copy_ready_title:
          type: string
          title: Copy Ready Title
        copy_ready_body:
          type: string
          title: Copy Ready Body
        asset_urls:
          items:
            type: string
          type: array
          title: Asset Urls
        tags:
          items:
            type: string
          type: array
          title: Tags
        submit_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Submit Url
        warnings:
          items:
            type: string
          type: array
          title: Warnings
      type: object
      required:
      - instructions
      - copy_ready_title
      - copy_ready_body
      title: BuildAssistPackResponse
    CertifyRequest:
      properties:
        destination_id:
          type: string
          title: Destination Id
        connection:
          $ref: '#/components/schemas/Connection'
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
      type: object
      required:
      - destination_id
      - connection
      title: CertifyRequest
    Connection:
      properties:
        api_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Key
        api_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Url
        username:
          anyOf:
          - type: string
          - type: 'null'
          title: Username
        password:
          anyOf:
          - type: string
          - type: 'null'
          title: Password
        token:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
        extra:
          additionalProperties: true
          type: object
          title: Extra
      type: object
      title: Connection
      description: Auth credentials for a platform connection.
    DeleteRequest:
      properties:
        platform_post_id:
          type: string
          title: Platform Post Id
        connection:
          $ref: '#/components/schemas/Connection'
      type: object
      required:
      - platform_post_id
      title: DeleteRequest
    DeleteResponse:
      properties:
        deleted:
          type: boolean
          title: Deleted
      type: object
      required:
      - deleted
      title: DeleteResponse
    DestinationCreate:
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        name:
          type: string
          title: Name
        url:
          type: string
          title: Url
        platform_key:
          type: string
          title: Platform Key
        connector_key:
          type: string
          title: Connector Key
        surface:
          type: string
          title: Surface
          default: topic
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
        audience_tags:
          items:
            type: string
          type: array
          title: Audience Tags
        language:
          type: string
          title: Language
          default: en
        geo:
          anyOf:
          - type: string
          - type: 'null'
          title: Geo
        est_audience:
          anyOf:
