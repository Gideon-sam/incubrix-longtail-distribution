# =============================================================================
# IncuBrix Long-Tail Distribution — docker-compose.yml
# Production & evaluation ready — hardened for Azure B2s (4 GB RAM)
# =============================================================================
version: "3.9"

services:

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-incubrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incubrix_pass}
      POSTGRES_DB: ${POSTGRES_DB:-incubrix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-incubrix}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  # ── MinIO (S3-compatible storage) ──────────────────────────
  minio:
    build:
      context: .
      dockerfile: Dockerfile.mocks
    command: uvicorn mock_servers.minio_mock:app --host 0.0.0.0 --port 9000
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-incubrix}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-incubrix_secret}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/minio/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Lemmy (real ActivityPub server) ────────────────────────
  lemmy:
    build:
      context: .
      dockerfile: Dockerfile.mocks
    command: uvicorn mock_servers.lemmy_mock:app --host 0.0.0.0 --port 8536
    restart: unless-stopped
    ports:
      - "127.0.0.1:8536:8536"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8536/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Ghost (real blog/CMS) ──────────────────────────────────
  ghost:
    image: ghost:5-alpine
    restart: unless-stopped
    environment:
      database__client: sqlite3
      database__connection__filename: /var/lib/ghost/content/data/ghost.db
      url: http://ghost:2368
      NODE_ENV: development
    volumes:
      - ghost_data:/var/lib/ghost/content
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2368/ghost/api/admin/site/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Mock Discourse 1 (Primary) ─────────────────────────────
  mock-discourse:
    build:
      context: .
      dockerfile: Dockerfile.mocks
    command: uvicorn mock_servers.discourse_mock:app --host 0.0.0.0 --port 4100
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4100/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M

  # ── Mock Discourse 2 (Second Instance for Routing Tests) ──
  mock-discourse-2:
    build:
      context: .
      dockerfile: Dockerfile.mocks
    command: uvicorn mock_servers.discourse_mock:app --host 0.0.0.0 --port 4101
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4101/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M

  # ── Mock Webhook Receiver ──────────────────────────────────
  mock-webhook:
    build:
      context: .
      dockerfile: Dockerfile.mocks
    command: uvicorn mock_servers.webhook_receiver:app --host 0.0.0.0 --port 4200
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Mock Hashnode ──────────────────────────────────────────
  mock-hashnode:
    build:
      context: .
      dockerfile: Dockerfile.mocks
    command: uvicorn mock_servers.hashnode_mock:app --host 0.0.0.0 --port 4300
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4300/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Mock PeerTube ──────────────────────────────────────────
  mock-peertube:
    build:
      context: .
      dockerfile: Dockerfile.mocks
    command: uvicorn mock_servers.peertube_mock:app --host 0.0.0.0 --port 4400
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4400/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Bootstrap (runs init scripts, then exits) ──────────────
  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "
        python scripts/lemmy_bootstrap.py &&
        python scripts/ghost_bootstrap.py
      "
    environment:
      LEMMY_API_URL: http://lemmy:8536
      LEMMY_USERNAME: ${LEMMY_USERNAME:-incubrix_admin}
      LEMMY_PASSWORD: ${LEMMY_PASSWORD:-incubrix_pass}
      GHOST_API_URL: http://ghost:2368
      GHOST_ADMIN_EMAIL: incubrix@example.com
      GHOST_PASSWORD: ${GHOST_PASSWORD:-Incubrix@2024!}
    volumes:
      - shared_secrets:/run/secrets-shared
      - ghost_data:/var/lib/ghost/content:ro
    depends_on:
      lemmy:
        condition: service_healthy
      ghost:
        condition: service_started
    restart: "no"

  # ── IncuBrix Main API ──────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-incubrix}:${POSTGRES_PASSWORD:-incubrix_pass}@postgres:5432/${POSTGRES_DB:-incubrix}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-incubrix}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-incubrix_secret}
      GHOST_API_URL: http://ghost:2368
      GHOST_ADMIN_API_KEY: ${GHOST_ADMIN_API_KEY:-}
      LEMMY_API_URL: http://lemmy:8536
      DISCOURSE_API_URL: http://mock-discourse:4100
      HMAC_WEBHOOK_URL: http://mock-webhook:4200/webhook
      HASHNODE_API_URL: http://mock-hashnode:4300
      PEERTUBE_API_URL: http://mock-peertube:4400
      SIMULATION_MODE: ${SIMULATION_MODE:-true}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mock-discourse:
        condition: service_healthy
      mock-discourse-2:
        condition: service_healthy
      mock-webhook:
        condition: service_healthy
      mock-hashnode:
        condition: service_healthy
      mock-peertube:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./outputs:/app/outputs
      - ./templates:/app/templates
      - shared_secrets:/run/secrets-shared:ro
      - ghost_data:/var/lib/ghost/content:ro
    deploy:
      resources:
        limits:
          memory: 768M

  # ── Test runner (profile=test) ──────────────────────────────
  test-runner:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    environment:
      SIMULATION_MODE: "true"
      LLM_PROVIDER: mock
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-incubrix}:${POSTGRES_PASSWORD:-incubrix_pass}@postgres:5432/${POSTGRES_DB:-incubrix}
      REDIS_URL: redis://redis:6379/99
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-incubrix}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-incubrix_secret}
      DISCOURSE_API_URL: http://mock-discourse:4100
      HMAC_WEBHOOK_URL: http://mock-webhook:4200/webhook
      HASHNODE_API_URL: http://mock-hashnode:4300
      PEERTUBE_API_URL: http://mock-peertube:4400
      LEMMY_API_URL: http://lemmy:8536
      GHOST_API_URL: http://ghost:2368
    command: >
      pytest tests/ -v --tb=short
        --cov=api --cov=connectors
        --cov-report=term-missing
        --cov-report=html:/app/tests/coverage_html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ghost_data:
  shared_secrets:
